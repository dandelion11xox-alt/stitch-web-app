"xl":"0.75rem","full":"9999px"},"spacing":{"space-xs":"0.25rem","space-xl":"2rem","gutter":"1rem","space-sm":"0.5rem","space-md":"1rem","space-lg":"1.5rem","margin":"1.25rem"},"fontFamily":{"body-md":["DM Sans"],"headline-lg":["Outfit"],"headline-md":["Outfit"],"label-sm":["DM Sans"],"body-lg":["DM Sans"],"label-md":["DM Sans"],"label-lg":["DM Sans"],"body-sm":["DM Sans"],"display-xl-mobile":["Outfit"],"headline-sm":["Outfit"],"display-xl":["Outfit"]},"fontSize":{"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.015em","fontWeight":"600"}],"headline-md":["24px",{"lineHeight":"32px","letterSpacing":"-0.01em","fontWeight":"600"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.04em","fontWeight":"500"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.03em","fontWeight":"500"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.02em","fontWeight":"600"}],"body-sm":["12px",{"lineHeight":"16px","fontWeight":"400"}],"display-xl-mobile":["48px",{"lineHeight":"56px","letterSpacing":"-0.02em","fontWeight":"600"}],"headline-sm":["20px",{"lineHeight":"28px","fontWeight":"500"}],"display-xl":["64px",{"lineHeight":"72px","letterSpacing":"-0.02em","fontWeight":"600"}]}}}}</script><style>

  </head><body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><h1 class="font-headline-sm text-headline-sm text-on-surface">Counter</h1><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 pb-safe bg-surface"><div class="flex flex-col w-full items-center justify-center py-space-xl gap-space-lg">
<div class="w-full max-w-sm flex flex-col items-center gap-space-lg">
<div class="inline-flex items-center gap-space-xs px-space-md py-space-xs rounded-full bg-secondary-fixed/60 text-on-secondary-fixed shadow-sm">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">ac_unit</span>
<span class="font-label-md text-label-md uppercase tracking-wider">Alpine Tally</span>
</div>
<div class="relative w-full rounded-xl bg-surface-container-lowest/90 backdrop-blur-xl shadow-xl p-space-xl flex flex-col items-center justify-center overflow-hidden">
<div class="absolute -top-12 -right-12 w-32 h-32 rounded-full bg-primary-fixed/40 blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-12 -left-12 w-32 h-32 rounded-full bg-secondary-fixed/40 blur-2xl pointer-events-none"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-space-sm">Current Count</span>
<div class="font-display-xl-mobile text-display-xl-mobile text-on-surface tabular-nums select-none transition-transform duration-150 ease-out" id="counter-display">
        0
      </div>
<p class="font-body-sm text-body-sm text-tertiary mt-space-sm transition-opacity duration-200" id="counter-hint">
        Tap + to begin counting
      </p>
</div>
<div class="w-full grid grid-cols-2 gap-gutter">
<button aria-label="Decrement count" class="h-16 rounded-full bg-secondary-fixed text-on-secondary-fixed shadow-md flex items-center justify-center active:scale-95 transition-all duration-150 hover:bg-secondary-fixed-dim" id="btn-decrement" type="button">
<span class="material-symbols-outlined text-[28px]">remove</span>
</button>
<button aria-label="Increment count" class="h-16 rounded-full bg-primary text-on-primary shadow-lg flex items-center justify-center active:scale-95 transition-all duration-150 hover:bg-primary-container" id="btn-increment" type="button">
<span class="material-symbols-outlined text-[28px]">add</span>
</button>
</div>
<button class="inline-flex items-center gap-space-xs px-space-lg py-space-sm rounded-full bg-surface-container-low text-on-surface-variant font-label-lg text-label-lg shadow-sm active:scale-95 transition-all duration-150 hover:bg-surface-container" id="btn-reset" type="button">
<span class="material-symbols-outlined text-[18px]">refresh</span>
<span>Reset</span>
</button>
</div>
</div>
<script>
  (function () {
    let count = 0;
    const display = document.getElementById('counter-display');
    const hint = document.getElementById('counter-hint');
    const btnInc = document.getElementById('btn-increment');
    const btnDec = document.getElementById('btn-decrement');
    const btnReset = document.getElementById('btn-reset');

    function animatePop() {
      display.classList.remove('scale-110');
      void display.offsetWidth;
      display.classList.add('scale-110');
      setTimeout(() => {
        display.classList.remove('scale-110');
      }, 140);
    }

    function updateUI() {
      display.textContent = count;
      if (count === 0) {
        hint.textContent = 'Tap + to begin counting';
      } else if (count > 0 && count % 10 === 0) {
        hint.textContent = 'Milestone reached: ' + count;
      } else {
        hint.textContent = count === 1 ? '1st tally recorded' : count + ' tallies recorded';
      }
      animatePop();
    }

    btnInc.addEventListener('click', function () {
      count += 1;
      updateUI();
    });

    btnDec.addEventListener('click', function () {
      count -= 1;
      updateUI();
    });

    btnReset.addEventListener('click', function () {
      if (count !== 0) {
        count = 0;
        updateUI();
      }
    });
  })();
</script></main></body></html>
